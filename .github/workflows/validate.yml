name: Validate CongressionalApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate required files
        run: |
          test -f index.html
          test -f styles.css
          test -f config.js
          test -f app.js
          test -f supabase/schema.sql
